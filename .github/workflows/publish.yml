name: Publish image

# openspec:ci-gate, change task 6.4 (bootstrap-rea-mcp-gateway). Enabled on 2026-11-15 with the maintainer's approval.
#
# Publishes ghcr.io/eguthriewastaken/rea-mcp: on every push to `main` the tags `latest` and `sha-<12>`, and on every
# `vX.Y.Z` tag the tags `X.Y.Z` and `sha-<12>` (scripts/image_tags.sh; any other ref publishes nothing and fails).
# It builds the image, repeats the checks of the `image` job in ci.yml (a wrong Ghidra or JDK hash must fail the
# build; the smoke test must pass), and only then pushes. It uses only the workflow's own token (no stored secrets)
# and the runner's Docker, so there is no third-party action to pin.
#
# One manual step remains after the first publish: GitHub creates the package private. Set it to public (the
# package's settings page), because the unRAID template pulls without credentials. The Dockerfile's
# org.opencontainers.image.source label links the package to this repository.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: # to re-run from main or from a vX.Y.Z tag; any other ref is refused by scripts/image_tags.sh

# Nothing by default; the one job asks for what it needs.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.repository == 'EGuthrieWasTaken/rea-mcp' # a fork's pushes must not publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # the workflow token may push to this repository's own package, and nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the image references for this ref
        id: refs
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          refs="$(scripts/image_tags.sh "$REPO" "$REF" "$SHA")"
          {
            echo "refs<<EOF"
            echo "$refs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build the image
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          args=()
          while IFS= read -r r; do args+=(-t "$r"); done <<<"$REFS"
          docker buildx build --platform linux/amd64 -f docker/Dockerfile "${args[@]}" --load .
      - name: A wrong Ghidra or JDK hash must fail the build
        run: scripts/check_hash_pins.sh rea-mcp-hashcheck
      - name: Smoke test the image that will be published
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: scripts/smoke_test.sh "$(head -n1 <<<"$REFS")"
      - name: Log in to GHCR with the workflow token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          while IFS= read -r r; do docker push "$r"; done <<<"$REFS"
